name: Build MVUM packs

# Cuts the Forest Service Motor Vehicle Use Map into per-state overlays and
# publishes them, so the app can fetch forest roads from a host we control.
#
# Why this exists at all: the app has always read forest roads live from
# apps.fs.usda.gov, which makes that one service the single point of failure for
# the feature — and it currently answers 500 for its whole catalogue. The same
# data is published as national shapefiles on a different Forest Service host
# that is up, so the split happens here, once, instead of on a phone at the
# moment somebody needs it.
#
# Publishes to a FIXED tag, deliberately. The basemap packs resolve through
# `releases/latest/download/packs.json`, and "latest" means the newest release
# in the repo — so an MVUM release published normally would start answering that
# URL and break basemap resolution. This release is force-moved to `mvum-latest`
# instead and is never "latest" for anyone.

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated states, or blank for all"
        required: false
        default: ""
  schedule:
    # Monthly. The upstream data is revised per forest "as needed" and the whole
    # national file was last cut in May 2025, so anything more often would
    # re-publish 300 MB of identical geometry.
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # The national downloads are ~340 MB and the trails .dbf is 2 GB
    # uncompressed; the split itself is CPU-bound over a million records.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # No setup-python step and no pip install: the builder is stdlib-only, so
      # the runner's own python3 is the whole toolchain.
      - name: Build the packs
        run: |
          python3 tools/build_mvum_packs.py \
            --out dist/mvum \
            ${{ github.event.inputs.states && format('--only {0}', github.event.inputs.states) || '' }} \
            --base-url "https://github.com/${{ github.repository_owner }}/griddown-packs/releases/download/mvum-latest"

      - name: What came out
        run: |
          ls -la dist/mvum
          echo "--- manifest ---"
          head -c 2000 dist/mvum/mvum.json

      # Fails the run rather than publishing a manifest that points at packs
      # nobody can read. A pack that parses is the minimum bar: the app reads
      # these with serde and a truncated file would draw as roads that stop.
      - name: Check every pack parses and matches its manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          out = pathlib.Path("dist/mvum")
          man = json.loads((out / "mvum.json").read_text())["states"]
          if not man:
              sys.exit("no packs were produced")
          for abbr, meta in man.items():
              p = out / f"{abbr}.geojson"
              raw = p.read_bytes()
              if len(raw) != meta["bytes"]:
                  sys.exit(f"{abbr}: size {len(raw)} != manifest {meta['bytes']}")
              if hashlib.sha256(raw).hexdigest() != meta["sha256"]:
                  sys.exit(f"{abbr}: sha256 mismatch")
              doc = json.loads(raw)
              if doc.get("type") != "FeatureCollection" or not doc.get("features"):
                  sys.exit(f"{abbr}: not a usable FeatureCollection")
              # The names the app's map expressions read. If dBase truncation
              # ever changes shape, this is where it should stop.
              props = doc["features"][0]["properties"]
              if "gd_kind" not in props:
                  sys.exit(f"{abbr}: features carry no gd_kind")
              print(f"{abbr}: {len(doc['features']):,} features, {len(raw)/1e6:.1f} MB OK")
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.PACKS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository_owner }}/griddown-packs"
          # Force-moved rather than versioned: the app asks for mvum-latest by
          # name, so there is exactly one release to look at and no chance of
          # it becoming the repo's "latest" and shadowing the basemap manifest.
          gh release delete mvum-latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create mvum-latest \
            --repo "$REPO" \
            --title "MVUM packs" \
            --notes "Per-state Forest Service Motor Vehicle Use Map overlays, cut from the national shapefiles on data.fs.usda.gov. Built $(date -u +%Y-%m-%d)." \
            dist/mvum/*
